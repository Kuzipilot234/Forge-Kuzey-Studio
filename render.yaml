# Render Blueprint: runs Forge Kuzey Studio as a free Node web service.
# Set GEMINI_API_KEY in the Render dashboard (Environment tab). It is never stored in this repo.
services:
  - type: web
    name: forge-kuzey-studio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
