<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge Kuzey Studio</title>
  <meta name="description" content="Turn an idea into ready-to-paste, scene-by-scene video prompts for Gemini (Veo).">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./" aria-label="Forge Kuzey Studio">
      <span class="clap" aria-hidden="true"></span>
      <span>
        <span class="brand-name">Forge Kuzey Studio</span>
        <span class="tagline" data-i18n="app.tagline"></span>
      </span>
    </a>
    <div class="top-actions">
      <label class="lang">
        <span class="sr" data-i18n="nav.lang"></span>
        <span aria-hidden="true">🌐</span>
        <select id="lang"></select>
      </label>
      <button class="icon-btn" id="historyBtn"><span aria-hidden="true">🕘</span> <span class="hide-sm" data-i18n="nav.history"></span></button>
      <button class="icon-btn" id="themeBtn" data-i18n-title="nav.theme"><span aria-hidden="true">◐</span></button>
    </div>
  </header>

  <main class="layout">
    <section class="wizard">
      <ol class="stepper" id="stepper">
        <li><button data-step="1"><span class="dot">1</span><span data-i18n="step.1"></span></button></li>
        <li><button data-step="2"><span class="dot">2</span><span data-i18n="step.2"></span></button></li>
        <li><button data-step="3"><span class="dot">3</span><span data-i18n="step.3"></span></button></li>
      </ol>

      <!-- Step 1: idea -->
      <div class="step" id="step1">
        <h1 data-i18n="s1.title"></h1>
        <p class="sub" data-i18n="s1.sub"></p>
        <textarea id="idea" rows="6" data-i18n-ph="s1.placeholder"></textarea>
        <div class="row-between">
          <div class="btn-row">
            <button class="soft" id="surpriseBtn"><span aria-hidden="true">🎲</span> <span data-i18n="s1.surprise"></span></button>
            <button class="soft" id="improveBtn"><span aria-hidden="true">✨</span> <span data-i18n="s1.improve"></span></button>
          </div>
          <span class="count" id="ideaCount"></span>
        </div>
        <p class="label" data-i18n="s1.examples"></p>
        <div class="chips" id="examples"></div>
        <div class="step-nav">
          <span></span>
          <button class="next" data-go="2"><span data-i18n="s1.next"></span> →</button>
        </div>
      </div>

      <!-- Step 2: look -->
      <div class="step" id="step2" hidden>
        <h1 data-i18n="s2.title"></h1>
        <h2 class="label" data-i18n="s2.type"></h2>
        <div class="type-grid" id="types" role="radiogroup"></div>
        <button class="link-btn" id="moreTypes"></button>

        <h2 class="label" data-i18n="s2.style"></h2>
        <div class="style-grid" id="styles" role="radiogroup"></div>

        <h2 class="label"><span data-i18n="s2.char"></span> <span class="opt-tag" data-i18n="s2.optional"></span></h2>
        <p class="hint" data-i18n="s2.charHint"></p>
        <div class="char-grid">
          <label><span data-i18n="s2.who"></span><input id="chWho" data-i18n-ph="s2.whoPh"></label>
          <label><span data-i18n="s2.looks"></span><input id="chLook" data-i18n-ph="s2.looksPh"></label>
          <label><span data-i18n="s2.outfit"></span><input id="chOutfit" data-i18n-ph="s2.outfitPh"></label>
          <label><span data-i18n="s2.place"></span><input id="chPlace" data-i18n-ph="s2.placePh"></label>
        </div>
        <div class="step-nav">
          <button class="back" data-go="1">← <span data-i18n="back"></span></button>
          <button class="next" data-go="3"><span data-i18n="s2.next"></span> →</button>
        </div>
      </div>

      <!-- Step 3: format -->
      <div class="step" id="step3" hidden>
        <h1 data-i18n="s3.title"></h1>
        <div class="platforms" id="platforms" role="radiogroup">
          <button data-pf="vertical" role="radio"><span class="frame f-916"></span><b data-i18n="pf.vertical"></b><small data-i18n="pf.verticalSub"></small></button>
          <button data-pf="wide" role="radio"><span class="frame f-169"></span><b data-i18n="pf.wide"></b><small data-i18n="pf.wideSub"></small></button>
          <button data-pf="square" role="radio"><span class="frame f-11"></span><b data-i18n="pf.square"></b><small data-i18n="pf.squareSub"></small></button>
        </div>

        <div class="two-col">
          <div>
            <h2 class="label" data-i18n="s3.scenes"></h2>
            <div class="seg" id="scenesSeg">
              <button data-v="auto" data-i18n="s3.auto"></button>
              <button data-v="3">3</button><button data-v="5">5</button><button data-v="8">8</button><button data-v="10">10</button>
            </div>
          </div>
          <div>
            <h2 class="label" data-i18n="s3.length"></h2>
            <div class="seg" id="lengthSeg">
              <button data-v="4"></button><button data-v="6"></button><button data-v="8"></button>
            </div>
          </div>
        </div>
        <p class="hint" data-i18n="s3.scenesHint"></p>

        <details class="more">
          <summary data-i18n="s3.more"></summary>
          <label class="check"><input type="checkbox" id="story"> <span data-i18n="s3.story"></span></label>
          <div class="opt-grid">
            <label><span data-i18n="s3.camera"></span>
              <select id="camera">
                <option value="auto" data-i18n="cam.auto"></option><option value="handheld" data-i18n="cam.handheld"></option>
                <option value="smooth" data-i18n="cam.smooth"></option><option value="static" data-i18n="cam.static"></option>
                <option value="drone" data-i18n="cam.drone"></option><option value="pov" data-i18n="cam.pov"></option>
              </select>
            </label>
            <label><span data-i18n="s3.pace"></span>
              <select id="pace">
                <option value="balanced" data-i18n="pace.balanced"></option><option value="calm" data-i18n="pace.calm"></option>
                <option value="viral" data-i18n="pace.viral"></option>
              </select>
            </label>
            <label><span data-i18n="s3.audio"></span>
              <select id="audio">
                <option value="full" data-i18n="audio.full"></option><option value="sfx" data-i18n="audio.sfx"></option>
                <option value="music" data-i18n="audio.music"></option><option value="silent" data-i18n="audio.silent"></option>
              </select>
            </label>
            <label><span data-i18n="s3.dialog"></span>
              <select id="dialogLang">
                <option value="English">English</option><option value="Turkish">Türkçe</option>
                <option value="Spanish">Español</option><option value="German">Deutsch</option>
                <option value="French">Français</option><option value="Italian">Italiano</option>
                <option value="Portuguese">Português</option><option value="Arabic">العربية</option>
                <option value="Russian">Русский</option><option value="Japanese">日本語</option>
              </select>
            </label>
          </div>
          <label class="check"><input type="checkbox" id="continuity" checked> <span data-i18n="s3.continuity"></span></label>
          <label class="check"><input type="checkbox" id="negatives" checked> <span data-i18n="s3.negatives"></span></label>
        </details>

        <div class="step-nav">
          <button class="back" data-go="2">← <span data-i18n="back"></span></button>
          <button class="go" id="generateBtn"><span aria-hidden="true">🎬</span> <span data-i18n="s3.generate"></span></button>
        </div>
      </div>

      <div class="status" id="status" role="status"></div>
    </section>

    <aside class="summary" aria-labelledby="sumTitle">
      <div class="sum-head">
        <h2 id="sumTitle" data-i18n="sum.title"></h2>
        <span class="mode" id="modeBadge"></span>
      </div>
      <dl id="summaryList"></dl>
      <button class="go small" id="sumGenerate"><span aria-hidden="true">🎬</span> <span data-i18n="sum.go"></span></button>
    </aside>
  </main>

  <section class="results" id="results" hidden>
    <div class="res-head">
      <div>
        <h2 data-i18n="res.title"></h2>
        <p class="meta" id="resMeta"></p>
      </div>
      <div class="btn-row">
        <button class="soft" id="copyAllBtn"><span aria-hidden="true">📋</span> <span data-i18n="res.copyAll"></span></button>
        <button class="soft" id="dlTxtBtn">⬇ .txt</button>
        <button class="soft" id="dlJsonBtn">⬇ .json</button>
        <button class="soft" id="restartBtn"><span aria-hidden="true">↺</span> <span data-i18n="res.restart"></span></button>
      </div>
    </div>
    <div class="howto">
      <b data-i18n="res.howTitle"></b>
      <ol>
        <li data-i18n="res.how1"></li>
        <li data-i18n="res.how2"></li>
        <li data-i18n="res.how3"></li>
      </ol>
    </div>
    <div class="board" id="board"></div>
  </section>

  <footer class="foot" data-i18n="foot"></footer>

  <dialog id="historyDlg">
    <div class="dlg">
      <h3 data-i18n="hist.title"></h3>
      <div id="historyList" class="history"></div>
      <div class="btn-row end">
        <button class="soft" id="clearHistoryBtn" data-i18n="hist.clear"></button>
        <button class="go small" id="closeHistoryBtn" data-i18n="hist.close"></button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="data.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
